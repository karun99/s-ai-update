<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Mapper - S-AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a1a;color:#e0e0e0;overflow:hidden;height:100vh}
#app{display:grid;grid-template-columns:350px 1fr 350px;height:100vh;gap:0}
#sidebar{background:#111128;border-right:1px solid #2a2a4a;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
#detail-panel{background:#111128;border-left:1px solid #2a2a4a;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
#canvas-wrap{position:relative;overflow:hidden;background:#0a0a1a}
#canvas-wrap canvas{display:block;width:100%;height:100%}
h2{font-size:14px;font-weight:600;color:#8888cc;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
h3{font-size:13px;font-weight:600;color:#aaaadd}
.search-row{display:flex;gap:8px}
.search-row input{flex:1;padding:8px 12px;border-radius:8px;border:1px solid #2a2a4a;background:#0d0d24;color:#e0e0e0;font-size:13px;outline:none}
.search-row input:focus{border-color:#5555aa}
.search-row button{padding:8px 16px;border-radius:8px;border:none;background:#4444aa;color:#fff;cursor:pointer;font-weight:600;font-size:13px}
.search-row button:hover{background:#5555bb}
.cat-filters{display:flex;flex-wrap:wrap;gap:4px}
.cat-filters button{padding:4px 10px;border-radius:12px;border:1px solid #2a2a4a;background:transparent;color:#8888cc;cursor:pointer;font-size:11px}
.cat-filters button.active{background:#4444aa;color:#fff;border-color:#4444aa}
.paper-item{padding:10px;border-radius:8px;background:#0d0d24;border:1px solid #1a1a3a;cursor:pointer;transition:all .2s}
.paper-item:hover{border-color:#4444aa;background:#151540}
.paper-item .title{font-size:13px;font-weight:500;color:#ddd;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.paper-item .meta{font-size:11px;color:#7777aa;display:flex;gap:8px;flex-wrap:wrap}
.paper-item .meta .cat{background:#222244;padding:1px 6px;border-radius:4px;color:#8888cc}
.paper-item .size-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.legend{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0;font-size:11px}
.legend-item{display:flex;align-items:center;gap:4px;color:#7777aa}
.legend-dot{width:8px;height:8px;border-radius:50%}
#detail-paper{margin-top:8px}
#detail-paper .d-title{font-size:16px;font-weight:600;color:#fff;margin-bottom:8px;line-height:1.3}
#detail-paper .d-authors{font-size:12px;color:#8888cc;margin-bottom:8px}
#detail-paper .d-cats{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
#detail-paper .d-cats span{background:#222244;padding:2px 8px;border-radius:4px;color:#aaaadd;font-size:11px}
#detail-paper .d-abstract{font-size:12px;color:#bbb;line-height:1.5;margin-bottom:12px}
#detail-paper .d-links{display:flex;gap:8px}
#detail-paper .d-links a{padding:6px 12px;border-radius:6px;text-decoration:none;font-size:12px;font-weight:500}
#detail-paper .d-links a.arxiv{background:#2a2a5a;color:#aaaaff}
#detail-paper .d-links a.pdf{background:#442244;color:#ffaaaa}
#detail-paper .d-stats{font-size:11px;color:#7777aa;margin-bottom:8px}
#graph-info{position:absolute;bottom:12px;left:12px;background:rgba(17,17,40,.85);padding:8px 12px;border-radius:8px;font-size:11px;color:#7777aa;pointer-events:none}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0}
.toolbar button{padding:4px 10px;border-radius:6px;border:1px solid #2a2a4a;background:transparent;color:#8888cc;cursor:pointer;font-size:11px}
.toolbar button:hover{background:#222244;color:#ccc}
#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#5555aa;font-size:14px}
.swarm-btn{padding:6px 12px;border-radius:8px;border:none;background:#228844;color:#fff;cursor:pointer;font-weight:600;font-size:12px;margin-top:8px;width:100%}
.swarm-btn:hover{background:#33aa55}
.swarm-result{background:#0d0d24;padding:10px;border-radius:8px;font-size:12px;color:#bbb;line-height:1.5;margin-top:8px;max-height:200px;overflow-y:auto}
@media(max-width:1000px){#app{grid-template-columns:1fr}#sidebar,#detail-panel{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h2>Search arXiv</h2>
    <div class="search-row">
      <input id="search-input" placeholder="e.g. quantum computing, author:Smith" />
      <button id="search-btn">Search</button>
    </div>
    <div>
      <h2>Categories</h2>
      <div class="cat-filters" id="cat-filters"></div>
    </div>
    <div>
      <h2>Results <span id="result-count" style="color:#7777aa;font-weight:400"></span></h2>
      <div id="paper-list" style="display:flex;flex-direction:column;gap:6px;margin-top:8px"></div>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="graph-canvas"></canvas>
    <div id="loading">Search for papers to build the map</div>
    <div id="graph-info"></div>
  </div>

  <div id="detail-panel">
    <h2>Paper Details</h2>
    <div id="detail-paper">
      <div style="color:#5555aa;font-size:13px;text-align:center;padding:40px 0">Select a paper on the map</div>
    </div>
    <button class="swarm-btn" id="swarm-analyze-btn" style="display:none">Analyze with S-AI Swarm</button>
    <div id="swarm-result"></div>
  </div>
</div>

<script>
const CAT_COLORS = {
  'hep-th': '#ff6b6b', 'hep-ph': '#ffa94d', 'hep-ex': '#ffd43b', 'hep-lat': '#f783ac',
  'gr-qc': '#ff922b', 'astro-ph': '#4dabf7', 'cond-mat': '#69db7c', 'quant-ph': '#9775fa',
  'physics': '#748ffc', 'math': '#38d9a9', 'cs': '#63e6be', 'nlin': '#da77f2',
  'nucl-th': '#e599f7', 'nucl-ex': '#b197fc', 'math-ph': '#a9e34b', 'q-bio': '#8ce99a',
  'q-fin': '#fcc419', 'stat': '#74c0fc', 'other': '#868e96'
};

let papers = [], graphData = { nodes: [], edges: [] }, selectedNode = null;
let simNodes = [], simEdges = [], animationId = null;
let isDragging = false, dragNode = null, dragOffsetX = 0, dragOffsetY = 0;
let scale = 1, offsetX = 0, offsetY = 0;
let categories = new Set();

const canvas = document.getElementById('graph-canvas');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvas-wrap');

function resize() {
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
}
resize();
window.addEventListener('resize', resize);

function getMainCategory(cats) {
  if (!cats || !cats.length) return 'other';
  const main = cats[0].split('.').slice(0, 2).join('.');
  return CAT_COLORS[main] ? main : cats[0].split('.')[0];
}

function getCategoryColor(cats) {
  const main = getMainCategory(cats);
  return CAT_COLORS[main] || CAT_COLORS['other'];
}

function getAgeColor(dateStr) {
  if (!dateStr) return '#666';
  const y = parseInt(dateStr.slice(0, 4));
  const now = new Date().getFullYear();
  const age = now - y;
  const t = Math.min(1, age / 20);
  const r = Math.round(100 + t * 50);
  const g = Math.round(200 - t * 150);
  const b = Math.round(255 - t * 200);
  return `rgb(${r},${g},${b})`;
}

function initSimulation() {
  simNodes = graphData.nodes.map(n => ({
    ...n, x: Math.random() * 800 - 400, y: Math.random() * 800 - 400,
    vx: 0, vy: 0, fx: 0, fy: 0
  }));
  const nodeMap = new Map(simNodes.map(n => [n.id, n]));
  simEdges = graphData.edges.filter(e => nodeMap.has(e.source) && nodeMap.has(e.target));
}

function simulateStep() {
  const REPULSION = 8000, ATTRACTION = 0.005, DAMPING = 0.85, CENTER = 0.01;
  const AREA = 2000;

  for (let i = 0; i < simNodes.length; i++) {
    const n = simNodes[i];
    n.fx = 0; n.fy = 0;
    for (let j = i + 1; j < simNodes.length; j++) {
      const m = simNodes[j];
      let dx = n.x - m.x, dy = n.y - m.y;
      let dist = Math.sqrt(dx * dx + dy * dy) || 1;
      let force = REPULSION / (dist * dist);
      n.fx += (dx / dist) * force;
      n.fy += (dy / dist) * force;
      m.fx -= (dx / dist) * force;
      m.fy -= (dy / dist) * force;
    }
    n.fx -= n.x * CENTER;
    n.fy -= n.y * CENTER;
  }

  for (const e of simEdges) {
    const s = nodeMap.get(e.source), t = nodeMap.get(e.target);
    if (!s || !t) continue;
    const dx = t.x - s.x, dy = t.y - s.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const force = (dist - 150) * ATTRACTION;
    s.fx += (dx / dist) * force;
    s.fy += (dy / dist) * force;
    t.fx -= (dx / dist) * force;
    t.fy -= (dy / dist) * force;
  }

  let totalEnergy = 0;
  for (const n of simNodes) {
    n.vx = (n.vx + n.fx) * DAMPING;
    n.vy = (n.vy + n.fy) * DAMPING;
    n.x += n.vx;
    n.y += n.vy;
    totalEnergy += n.vx * n.vx + n.vy * n.vy;
  }
  return totalEnergy / simNodes.length;
}

const nodeMap = () => new Map(simNodes.map(n => [n.id, n]));

function drawGraph() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width / 2 + offsetX;
  const cy = canvas.height / 2 + offsetY;

  for (const e of simEdges) {
    const s = simNodes.find(n => n.id === e.source);
    const t = simNodes.find(n => n.id === e.target);
    if (!s || !t) continue;
    ctx.beginPath();
    ctx.moveTo(s.x * scale + cx, s.y * scale + cy);
    ctx.lineTo(t.x * scale + cx, t.y * scale + cy);
    ctx.strokeStyle = 'rgba(68,68,170,0.15)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  for (const n of simNodes) {
    const x = n.x * scale + cx, y = n.y * scale + cy;
    const r = Math.max(3, n.size * scale * 0.8);
    const isSelected = selectedNode && selectedNode.id === n.id;

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    const color = n.ageColor || getAgeColor(n.year);
    ctx.fillStyle = isSelected ? '#ffd43b' : color;
    ctx.globalAlpha = 0.85;
    ctx.fill();
    ctx.globalAlpha = 1;

    if (isSelected) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    if (scale > 0.6 && r > 5) {
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.font = `${Math.max(8, Math.min(11, r * 0.8))}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(n.label.slice(0, 15), x, y + 3);
    }
  }
}

function runSimulation() {
  if (simNodes.length === 0) return;
  let energy;
  let steps = 0;
  const maxSteps = 200;
  do {
    energy = simulateStep();
    steps++;
  } while (energy > 0.5 && steps < maxSteps);
  drawGraph();
  document.getElementById('loading').textContent = '';
  document.getElementById('graph-info').textContent = `${simNodes.length} papers, ${simEdges.length} citations`;
}

function searchArxiv(query) {
  document.getElementById('loading').textContent = 'Searching arXiv...';
  const cat = document.querySelector('.cat-filters .active');
  let fullQuery = query;
  if (cat && cat.dataset.cat) fullQuery = `cat:${cat.dataset.cat} AND (${query})`;
  fetch(`/api/research/search?q=${encodeURIComponent(fullQuery)}&max=30`)
    .then(r => r.json())
    .then(data => {
      papers = data.papers || [];
      graphData = data.graph || { nodes: [], edges: [] };
      renderPaperList();
      initSimulation();
      runSimulation();
      if (data.categories) {
        categories = new Set(data.categories);
        renderCatFilters();
      }
      document.getElementById('result-count').textContent = `(${papers.length})`;
    })
    .catch(e => {
      document.getElementById('loading').textContent = 'Search failed: ' + e.message;
    });
}

function renderPaperList() {
  const list = document.getElementById('paper-list');
  list.innerHTML = '';
  for (const p of papers) {
    const div = document.createElement('div');
    div.className = 'paper-item';
    const color = getCategoryColor(p.categories);
    div.innerHTML = `
      <div class="title"><span class="size-dot" style="background:${color}"></span>${escapeHtml(p.title)}</div>
      <div class="meta">
        <span>${p.authors.slice(0, 2).join(', ')}${p.authors.length > 2 ? ' et al.' : ''}</span>
        <span>${p.year || ''}</span>
        <span class="cat">${getMainCategory(p.categories)}</span>
      </div>
    `;
    div.addEventListener('click', () => selectPaper(p.arxivId));
    list.appendChild(div);
  }
}

function renderCatFilters() {
  const el = document.getElementById('cat-filters');
  el.innerHTML = '<button class="active" data-cat="">All</button>';
  for (const c of [...categories].sort()) {
    const btn = document.createElement('button');
    btn.dataset.cat = c;
    btn.textContent = c;
    btn.addEventListener('click', () => {
      el.querySelectorAll('.active').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const q = document.getElementById('search-input').value;
      if (q) searchArxiv(q);
    });
    el.appendChild(btn);
  }
}

function selectPaper(arxivId) {
  const node = graphData.nodes.find(n => n.arxivId === arxivId);
  if (!node) {
    const paper = papers.find(p => p.arxivId === arxivId);
    if (!paper) return;
    selectedNode = { id: paper.arxivId, ...paper };
  } else {
    selectedNode = node;
  }
  showDetail(selectedNode);
  drawGraph();
}

function showDetail(node) {
  const el = document.getElementById('detail-paper');
  el.innerHTML = `
    <div class="d-title">${escapeHtml(node.title)}</div>
    <div class="d-authors">${node.authors || 'Unknown authors'}</div>
    <div class="d-cats">${(node.categories || []).map(c => `<span>${c}</span>`).join('')}</div>
    <div class="d-stats">Citations: ${node.citationCount || 0} | Year: ${node.year || '?'}</div>
    <div class="d-abstract">${escapeHtml(node.abstract || 'No abstract available').slice(0, 500)}...</div>
    <div class="d-links">
      <a class="arxiv" href="${node.absLink || '#'}" target="_blank">arXiv</a>
      <a class="pdf" href="${node.pdfLink || '#'}" target="_blank">PDF</a>
    </div>
  `;
  document.getElementById('swarm-analyze-btn').style.display = 'block';
}

function escapeHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

document.getElementById('search-btn').addEventListener('click', () => {
  const q = document.getElementById('search-input').value.trim();
  if (q) searchArxiv(q);
});

document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('search-btn').click();
});

document.getElementById('swarm-analyze-btn').addEventListener('click', () => {
  if (!selectedNode) return;
  const resultEl = document.getElementById('swarm-result');
  resultEl.innerHTML = '<div class="swarm-result">Swarm analyzing paper... <span class="spinner"></span></div>';
  fetch('/api/swarm/query', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      question: `Analyze this research paper: "${selectedNode.title}" by ${selectedNode.authors || 'unknown'}. Abstract: ${(selectedNode.abstract || '').slice(0, 1000)}. Provide a brief analysis of its contributions, methodology, and significance.`,
      maxRounds: 1
    })
  })
    .then(r => r.json())
    .then(data => {
      resultEl.innerHTML = `<div class="swarm-result">${escapeHtml(data.content || 'No analysis returned.')}</div>`;
    })
    .catch(e => {
      resultEl.innerHTML = `<div class="swarm-result" style="color:#ff6b6b">Error: ${e.message}</div>`;
    });
});

canvas.addEventListener('mousedown', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const cx = canvas.width / 2 + offsetX, cy = canvas.height / 2 + offsetY;
  for (const n of simNodes) {
    const x = n.x * scale + cx, y = n.y * scale + cy;
    const r = Math.max(3, n.size * scale * 0.8);
    if (Math.hypot(mx - x, my - y) < r + 5) {
      isDragging = true;
      dragNode = n;
      dragOffsetX = mx - x;
      dragOffsetY = my - y;
      selectPaper(n.arxivId);
      return;
    }
  }
  isDragging = false;
});

canvas.addEventListener('mousemove', e => {
  if (!isDragging || !dragNode) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const cx = canvas.width / 2 + offsetX, cy = canvas.height / 2 + offsetY;
  dragNode.x = (mx - dragOffsetX - cx) / scale;
  dragNode.y = (my - dragOffsetY - cy) / scale;
  dragNode.vx = 0; dragNode.vy = 0;
  drawGraph();
});

canvas.addEventListener('mouseup', () => { isDragging = false; dragNode = null; });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  scale = Math.max(0.1, Math.min(5, scale * delta));
  drawGraph();
}, { passive: false });

canvas.addEventListener('dblclick', () => {
  scale = 1; offsetX = 0; offsetY = 0;
  drawGraph();
});

searchArxiv('cat:cs.AI AND (machine learning)');
</script>
</body>
</html>
