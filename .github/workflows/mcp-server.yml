name: MCP server

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
- uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund --ignore-scripts || true
      - name: MCP server smoke tests
        env:
          MCP_TEST_RUNNER: 'node'
        run: python3 -m unittest discover -s tests -p "test_mcp_server.py" -v
