name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 6:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ── Gitleaks (secret detection) ──────────────────────────────────
  gitleaks:
    name: Gitleaks — Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── OSV-Scanner (known vulnerabilities) ──────────────────────────
  osv-scanner:
    name: OSV-Scanner — Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |-
            --format table
            --recursive
            ./
        continue-on-error: false

  # ── govulncheck (Go vuln DB — if applicable) ────────────────────
  govulncheck:
    name: govulncheck — Go Vulnerability DB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck on Go sources
        run: |
          if find . -name "*.go" -not -path "*/vendor/*" -not -path "*/node_modules/*" | head -1 | grep -q .; then
            govulncheck ./...
          else
            echo "No Go files found — skipping govulncheck"
          fi

  # ── Semgrep (SAST / static analysis) ────────────────────────────
  semgrep:
    name: Semgrep — SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: semgrep ci --sarif --output=semgrep-results.sarif
        env:
          SEMGREP_RULES: >-
            p/default
            p/typescript
            p/node
            p/security-audit
            p/owasp-top-ten
            p/secrets
            p/dockerfile
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif

  # ── npm audit ───────────────────────────────────────────────────
  npm-audit:
    name: npm audit — Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: npm audit (all — informational)
        run: npm audit --audit-level=critical || true

  # ── License audit ───────────────────────────────────────────────
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check for production dependencies with copyleft licenses
        run: |
          echo "Checking for GPL/AGPL/SSPL licenses in production dependencies..."
          FAIL=0
          for pkg in $(node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('node_modules/@anthropic-ai/sdk/package.json','utf8'));
            // Just list top-level prod deps
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            const deps = Object.keys(pkg.dependencies || {});
            deps.forEach(d => console.log(d));
          " 2>/dev/null || true); do
            LICENSE_FILE="node_modules/$pkg/LICENSE" 
            if [ -f "$LICENSE_FILE" ]; then
              if grep -qiE "GPL|AGPL|SSPL" "$LICENSE_FILE" 2>/dev/null; then
                echo "  WARNING: $pkg has a copyleft license"
                FAIL=1
              fi
            fi
          done
          if [ "$FAIL" -eq 1 ]; then
            echo "::warning::Copyleft licenses detected in production dependencies"
          else
            echo "  All production dependencies use permissive licenses"
          fi

  # ── Lint & Typecheck ────────────────────────────────────────────
  lint-typecheck:
    name: Lint & TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript compile check
        run: npx tsc --noEmit
      - name: Run tests
        run: |
          npm run build 2>/dev/null || true
          npx tsc -p tsconfig.test.json 2>/dev/null || true
          node --test dist/test/security/*.test.js

  # ── Summary ─────────────────────────────────────────────────────
  security-summary:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [gitleaks, osv-scanner, semgrep, npm-audit, lint-typecheck]
    if: always()
    steps:
      - name: Check all security jobs
        run: |
          echo "=== Security Scan Summary ==="
          echo "Gitleaks:       ${{ needs.gitleaks.result }}"
          echo "OSV-Scanner:    ${{ needs.osv-scanner.result }}"
          echo "Semgrep:        ${{ needs.semgrep.result }}"
          echo "npm audit:      ${{ needs.npm-audit.result }}"
          echo "Lint/Typecheck: ${{ needs.lint-typecheck.result }}"
          echo ""
          FAIL=0
          for result in "${{ needs.gitleaks.result }}" "${{ needs.osv-scanner.result }}" "${{ needs.semgrep.result }}" "${{ needs.lint-typecheck.result }}"; do
            if [ "$result" = "failure" ]; then
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 1 ]; then
            echo "::error::One or more security gates failed"
            exit 1
          fi
          echo "All security gates passed"
