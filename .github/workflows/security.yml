name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 6:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ── Gitleaks (secret detection) ──────────────────────────────────
  gitleaks:
    name: Gitleaks — Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── OSV-Scanner (known vulnerabilities) ──────────────────────────
  osv-scanner:
    name: OSV-Scanner — Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --format table
            --recursive
            ./
        continue-on-error: false

  # ── govulncheck (Go vuln DB — if applicable) ────────────────────
  govulncheck:
    name: govulncheck — Go Vulnerability DB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck on Go sources
        run: |
          if find . -name "*.go" -not -path "*/vendor/*" -not -path "*/node_modules/*" | head -1 | grep -q .; then
            govulncheck ./...
          else
            echo "No Go files found — skipping govulncheck"
          fi

  # ── Semgrep (SAST / static analysis) ────────────────────────────
  semgrep:
    name: Semgrep — SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: semgrep ci --sarif --output=semgrep-results.sarif
        env:
          SEMGREP_RULES: >-
            p/default
            p/typescript
            p/node
            p/security-audit
            p/owasp-top-ten
            p/secrets
            p/dockerfile
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif

  # ── npm audit ───────────────────────────────────────────────────
  npm-audit:
    name: npm audit — Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: npm audit (all — informational)
        run: npm audit --audit-level=critical || true

  # ── License audit ───────────────────────────────────────────────
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check for copyleft licenses in production dependencies
        run: |
          echo "Checking for GPL/AGPL/SSPL/MPL licenses in production dependencies..."
          FAIL=0
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const deps = Object.keys(pkg.dependencies || {});
            const copyleft = ["GPL", "AGPL", "SSPL", "MPL", "LGPL", "EPL"];
            for (const d of deps) {
              try {
                const dir = "node_modules/" + d.replace("/", "/");
                const p = JSON.parse(fs.readFileSync(dir + "/package.json", "utf8"));
                const lic = (p.license || "");
                for (const c of copyleft) {
                  if (lic.toUpperCase().includes(c)) {
                    console.log("  WARNING: " + d + " uses " + lic);
                    process.exitCode = 1;
                  }
                }
              } catch { /* missing/private */ }
            }
            console.log("  License scan complete");
          ' || FAIL=1
          if [ "$FAIL" -eq 1 ]; then
            echo "::warning::Copyleft licenses detected in production dependencies"
          else
            echo "  All production dependencies use permissive licenses"
          fi

  # ── Lint & Typecheck ────────────────────────────────────────────
  lint-typecheck:
    name: Lint & TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build TypeScript
        run: npx tsc --noEmit
      - name: Build & run security tests
        run: |
          npx tsc -p tsconfig.test.json
          node --test dist/test/security/*.test.js

  # ── Summary ─────────────────────────────────────────────────────
  security-summary:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [gitleaks, osv-scanner, semgrep, npm-audit, lint-typecheck]
    if: always()
    steps:
      - name: Check all security jobs
        run: |
          echo "=== Security Scan Summary ==="
          echo "Gitleaks:       ${{ needs.gitleaks.result }}"
          echo "OSV-Scanner:    ${{ needs.osv-scanner.result }}"
          echo "Semgrep:        ${{ needs.semgrep.result }}"
          echo "npm audit:      ${{ needs.npm-audit.result }}"
          echo "Lint/Typecheck: ${{ needs.lint-typecheck.result }}"
          echo ""
          FAIL=0
          for result in "${{ needs.gitleaks.result }}" "${{ needs.osv-scanner.result }}" "${{ needs.semgrep.result }}" "${{ needs.lint-typecheck.result }}"; do
            if [ "$result" = "failure" ]; then
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 1 ]; then
            echo "::error::One or more security gates failed"
            exit 1
          fi
          echo "All security gates passed"
